<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sanctum Chess — 3D Gothic Cathedral (Diamond vs. Smoky Quartz)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />

  <link rel="stylesheet" href="./styles.css" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/VignetteShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/Pass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>
  <!-- 3D WebGL Viewport -->
  <div id="canvas-container"></div>
  <div class="vignette-overlay"></div>

  <!-- Minimalist Material Design 3 Status Pill -->
  <header class="m3-top-bar" role="status" aria-live="polite">
    <div class="brand-mark">
      <span class="material-symbols-rounded" style="font-size: 19px;">diamond</span>
      <span>SANCTUM</span>
    </div>

    <div class="divider-v"></div>

    <div class="turn-chip">
      <span id="turn-gem" class="crystal-indicator diamond"></span>
      <span id="turn-label">Diamond's Turn</span>
    </div>

    <div class="clock-pair" aria-label="Chess clocks" aria-live="off">
      <div id="clock-white" class="clock-chip active" title="Diamond clock" aria-label="Diamond clock">
        <span class="clock-name" aria-hidden="true">D</span>
        <time id="clock-white-value">10:00</time>
      </div>
      <div id="clock-black" class="clock-chip" title="Quartz clock" aria-label="Quartz clock">
        <span class="clock-name" aria-hidden="true">Q</span>
        <time id="clock-black-value">10:00</time>
      </div>
    </div>

    <span id="state-badge" class="state-badge">Move 1</span>

    <div class="divider-v"></div>

    <div class="captured-summary" title="Shattered Crystal Pieces">
      <span class="shard-count diamond-text">
        <span>◆</span>
        <span id="diamond-captures">0</span>
      </span>
      <span>/</span>
      <span class="shard-count quartz-text">
        <span>◆</span>
        <span id="quartz-captures">0</span>
      </span>
    </div>
  </header>

  <!-- Move History Panel -->
  <aside id="history-panel" class="history-panel" aria-label="Move history">
    <div class="history-header">
      <span>Move History</span>
      <button id="btn-toggle-history" class="history-toggle" title="Toggle history">≡</button>
    </div>
    <ol id="move-list" class="move-list"></ol>
    <div class="history-actions">
      <button id="btn-export-pgn" class="m3-nav-btn" title="Export PGN">PGN</button>
      <button id="btn-save-game" class="m3-nav-btn" title="Save game">Save</button>
      <button id="btn-load-game" class="m3-nav-btn" title="Load game">Load</button>
    </div>
  </aside>

  <!-- Floating Material Design 3 Best Move Suggestion Chip -->
  <div id="hint-banner" class="m3-hint-banner" role="region" aria-label="Suggested Best Move">
    <span class="material-symbols-rounded hint-icon">auto_awesome</span>
    <span id="hint-text">Best Move: G1 --> F3</span>
    <button id="btn-play-suggested" class="hint-play-btn" title="Execute this suggested move">
      Play Move
    </button>
    <button id="btn-dismiss-hint" class="hint-dismiss-btn" title="Dismiss hint" aria-label="Dismiss hint">
      <span class="material-symbols-rounded" style="font-size: 17px;">close</span>
    </button>
  </div>

  <!-- Collapsible Material Design 3 Navigation Dock -->
  <div id="nav-dock" class="nav-dock">
    <div class="nav-scroll-shell">
      <nav id="bottom-nav" class="m3-bottom-nav" aria-label="Single-Level Camera and Game Navigation">
        <button class="m3-nav-btn cam-toggle active" data-cam="orbit" title="Free 3D Cathedral Orbit View">
          <span class="material-symbols-rounded">3d_rotation</span>
          <span class="btn-label">Orbit</span>
        </button>

        <button class="m3-nav-btn cam-toggle" data-cam="white" title="Diamond (White) Player Perspective">
          <span class="material-symbols-rounded">person</span>
          <span class="btn-label">Diamond POV</span>
        </button>

        <button class="m3-nav-btn cam-toggle" data-cam="black" title="Smoky Quartz (Black) Player Perspective">
          <span class="material-symbols-rounded">visibility</span>
          <span class="btn-label">Quartz POV</span>
        </button>

        <button class="m3-nav-btn cam-toggle" data-cam="top" title="Top-Down Tactical Grid View">
          <span class="material-symbols-rounded">grid_on</span>
          <span class="btn-label">Top-Down</span>
        </button>

        <button class="m3-nav-btn cam-toggle" data-cam="cathedral" title="Dramatic Gothic Cathedral Nave View">
          <span class="material-symbols-rounded">church</span>
          <span class="btn-label">Cathedral</span>
        </button>

        <div class="divider-v"></div>

        <button id="btn-suggest" class="m3-nav-btn best-move-fab" title="Analyze board and highlight the suggested best move">
          <span class="material-symbols-rounded">lightbulb</span>
          <span class="btn-label">Best Move</span>
        </button>

        <div class="divider-v"></div>

        <label class="difficulty-wrap" title="AI difficulty">
          <span class="material-symbols-rounded">tune</span>
          <select id="difficulty" class="difficulty-select">
            <option value="1">Easy</option>
            <option value="2" selected>Medium</option>
            <option value="3">Hard</option>
          </select>
        </label>

        <label class="clock-control-wrap" title="Chess clock time control">
          <span class="clock-control-label">Time</span>
          <select id="clock-control" class="difficulty-select" aria-label="Chess clock time control">
            <option value="3">3 min</option>
            <option value="5">5 min</option>
            <option value="10" selected>10 min</option>
          </select>
        </label>

        <button id="btn-mode" class="m3-nav-btn active" title="Switch between AI Opponent and 2-Player Local">
          <span id="mode-icon" class="material-symbols-rounded">smart_toy</span>
          <span id="mode-label" class="btn-label">vs AI</span>
        </button>

        <button id="btn-undo" class="m3-nav-btn" title="Undo Last Turn" disabled>
          <span class="material-symbols-rounded">undo</span>
          <span class="btn-label">Undo</span>
        </button>

        <button id="btn-redo" class="m3-nav-btn" title="Redo Last Turn" disabled>
          <span class="material-symbols-rounded">redo</span>
          <span class="btn-label">Redo</span>
        </button>

        <button id="btn-resign" class="m3-nav-btn" title="Resign the current game">
          <span class="material-symbols-rounded">flag</span>
          <span class="btn-label">Resign</span>
        </button>

        <button id="btn-reset" class="m3-nav-btn" title="Reset Board for a New Game">
          <span class="material-symbols-rounded">restart_alt</span>
          <span class="btn-label">Reset</span>
        </button>

        <button id="btn-audio" class="m3-nav-btn icon-only active" title="Toggle Crystal Sound Effects">
          <span id="audio-icon" class="material-symbols-rounded">volume_up</span>
        </button>

        <input id="volume-slider" type="range" min="0" max="1" step="0.05" value="0.8" title="Volume" />
      </nav>

      <button id="nav-scroll-hint" class="nav-scroll-hint" type="button"
              title="Show more options" aria-label="Scroll to more options" aria-hidden="true" tabindex="-1">
        <span class="nav-scroll-hint-label">More</span>
        <span class="material-symbols-rounded" aria-hidden="true">chevron_right</span>
      </button>
    </div>

    <button id="btn-nav-toggle" class="nav-toggle" type="button"
            aria-expanded="true" aria-controls="bottom-nav" title="Collapse menu" aria-label="Collapse menu">
      <span class="material-symbols-rounded nav-toggle-icon" aria-hidden="true">keyboard_arrow_down</span>
      <span class="nav-toggle-label">Hide</span>
    </button>
  </div>

  <!-- Pawn Promotion Dialog -->
  <div id="promo-modal" class="m3-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="promo-title">
    <div class="m3-dialog">
      <h2 id="promo-title" class="m3-dialog-title">CRYSTAL ASCENSION</h2>
      <p class="m3-dialog-subtitle">Select the vessel your promoted Pawn shall crystallize into:</p>
      <div class="promo-grid">
        <button class="promo-card" data-promo="q">
          <span class="promo-symbol">♛</span>
          <span class="promo-name">Queen</span>
        </button>
        <button class="promo-card" data-promo="r">
          <span class="promo-symbol">♜</span>
          <span class="promo-name">Rook</span>
        </button>
        <button class="promo-card" data-promo="b">
          <span class="promo-symbol">♝</span>
          <span class="promo-name">Bishop</span>
        </button>
        <button class="promo-card" data-promo="n">
          <span class="promo-symbol">♞</span>
          <span class="promo-name">Knight</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Game Over Dialog -->
  <div id="gameover-modal" class="m3-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="gameover-title">
    <div class="m3-dialog">
      <h2 id="gameover-title" class="m3-dialog-title">CHECKMATE</h2>
      <p id="gameover-subtitle" class="m3-dialog-subtitle">Diamond claims victory in the Gothic Cathedral.</p>
      <div class="dialog-actions">
        <button id="btn-modal-new" class="m3-nav-btn best-move-fab">New Match</button>
        <button id="btn-modal-inspect" class="m3-nav-btn" style="border-color: rgba(255,255,255,0.16);">Inspect Board</button>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
